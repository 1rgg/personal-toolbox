# CS2 Events Hub — Nginx 反向代理
#
# 纯 IP 访问（无域名、无备案）：监听 8080。
# 中国大陆节点未备案时 80/443 会被运营商拦截，所以走非标端口。
# 将来有了备案域名，把 listen 改成 80，再加 server_name 与证书即可。

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # 安全头。没有域名也就不需要 HSTS。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求体上限：本站没有任何上传接口
    client_max_body_size 1m;

    # 隐藏版本号
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 拦截 force=1 ──────────────────────────────────
    # /api/live?force=1 会绕过所有缓存直接打 Liquipedia。
    # 站点公开后必须挡掉，否则被人刷几下就是 IP 封禁 + 30 分钟冷却。
    if ($arg_force = "1") {
        return 403;
    }

    # ── API ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Liquipedia 单个请求最长 25 秒超时，这里留足余量
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 接口响应不缓存
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # ── 静态资源 ──────────────────────────────────────
    location /assets/ {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
